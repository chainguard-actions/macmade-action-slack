name: Test missing SLACK_WEBHOOK_URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without SLACK_WEBHOOK_URL (expect failure)
        id: action
        uses: .
        with:
          channel: '#test-channel'
          status: success
          title: Test Notification
          text: This is a test
        continue-on-error: true

      - name: Assert action failed due to missing webhook URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SLACK_WEBHOOK_URL is not set, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when SLACK_WEBHOOK_URL is not set"
