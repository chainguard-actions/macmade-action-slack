name: Test basic inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with all required inputs and a fake webhook URL
        id: action
        uses: .
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: https://hooks.slack.com/services/FAKE/FAKE/FAKE
        with:
          channel: '#ci'
          status: success
          title: 'Test Notification'
          text: 'Testing basic inputs'

      - name: Assert action attempted to send (failed at HTTP, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the webhook URL is fake (HTTP error),
          # NOT because of missing/invalid inputs. Either way, outcome is failure.
          # The key assertion is that the action ran past input validation.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with all required inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
